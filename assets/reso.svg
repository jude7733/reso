<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Neon Cyan to Violet Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Glowing Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1.0" />
    </linearGradient>

    <!-- Accent Gold / Hi-Res Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#cyanPurple)" stroke-width="4" stroke-opacity="0.8" />

  <!-- Inner Concentric Vinyl Grooves / Wave Circles (Acoustic Resonance) -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6" />
  <circle cx="256" cy="230" r="140" fill="none" stroke="#9d4edd" stroke-width="1.5" stroke-opacity="0.2" />
  <circle cx="256" cy="230" r="110" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8" />
  <circle cx="256" cy="230" r="80" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Radio Transmission Arcs (Left & Right Waves) -->
  <!-- Left Waves -->
  <path d="M 150 170 A 90 90 0 0 0 150 290" fill="none" stroke="url(#cyanPurple)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 115 135 A 140 140 0 0 0 115 325" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M 80 100 A 190 190 0 0 0 80 360" fill="none" stroke="#00a8ff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.35" />

  <!-- Right Waves -->
  <path d="M 362 170 A 90 90 0 0 1 362 290" fill="none" stroke="url(#cyanPurple)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 397 135 A 140 140 0 0 1 397 325" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M 432 100 A 190 190 0 0 1 432 360" fill="none" stroke="#00a8ff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.35" />

  <!-- Center Audiophile Pulse / Stylized Tuning Core -->
  <circle cx="256" cy="230" r="48" fill="#0d1b2a" stroke="url(#cyanPurple)" stroke-width="5" filter="url(#neonGlow)" />
  <circle cx="256" cy="230" r="22" fill="url(#cyanPurple)" />
  <circle cx="256" cy="230" r="8" fill="#ffffff" />

  <!-- Vertical Spectrum Equalizer Bars below the core -->
  <g transform="translate(186, 310)">
    <rect x="0" y="30" width="8" height="30" rx="4" fill="#00f0ff" opacity="0.6" />
    <rect x="18" y="15" width="8" height="45" rx="4" fill="#00f0ff" opacity="0.8" />
    <rect x="36" y="5" width="8" height="55" rx="4" fill="#00f0ff" />
    <rect x="54" y="0" width="8" height="60" rx="4" fill="#ffffff" filter="url(#neonGlow)" />
    <rect x="72" y="8" width="8" height="52" rx="4" fill="#00a8ff" />
    <rect x="90" y="18" width="8" height="42" rx="4" fill="#9d4edd" />
    <rect x="108" y="24" width="8" height="36" rx="4" fill="#9d4edd" opacity="0.8" />
    <rect x="126" y="32" width="8" height="28" rx="4" fill="#9d4edd" opacity="0.5" />
  </g>

  <!-- Bit-Perfect / Hi-Res Golden Badge Dot -->
  <circle cx="256" cy="120" r="6" fill="url(#goldGrad)" filter="url(#neonGlow)" />

  <!-- Clean Wordmark: RESO -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#00f0ff" letter-spacing="12" text-anchor="middle" filter="url(#neonGlow)">RESO</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="4" text-anchor="middle" opacity="0.6">LOSSLESS RADIO</text>
</svg>
